<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NER SmartLogix</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#0b0f1a;
 --card:#111827;
 --panel:#0d121f;
 --text:#e8edf5;
 --muted:#64748b;
 --teal:#5eead4;
 --orange:#fb923c;
 --red:#ef4444;
 --green:#34d399;
}

body{
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--text);
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.app{
 min-height:100vh;
 background:var(--bg);
}

.high-contrast{
 --bg:#000;
 --card:#090909;
 --panel:#050505;
 --text:#fff;
}

.hidden{display:none!important}

.toast{
 position:fixed;
 right:20px;
 top:20px;
 z-index:1000;
 padding:14px 18px;
 border:1px solid #5eead455;
 border-radius:10px;
 background:#111827;
 box-shadow:0 15px 40px #0008;
}

.toast span{
 color:var(--teal);
 margin-right:8px;
}

.mobile-header{
 display:none;
 position:fixed;
 z-index:500;
 top:0;
 left:0;
 right:0;
 height:64px;
 padding:0 18px;
 align-items:center;
 justify-content:space-between;
 background:#0b0f1af5;
 border-bottom:1px solid #ffffff10;
 backdrop-filter:blur(15px);
}

.logo{font-weight:bold}
.logo b{color:var(--teal)}

.mobile-menu{
 border:1px solid #ffffff18;
 background:#111827;
 color:white;
 border-radius:8px;
 padding:8px 12px;
}

.sidebar{
 position:fixed;
 z-index:400;
 top:0;
 bottom:0;
 left:0;
 width:256px;
 background:var(--panel);
 border-right:1px solid #ffffff0d;
 display:flex;
 flex-direction:column;
}

.side-logo{
 padding:25px;
 border-bottom:1px solid #ffffff0d;
}

.side-logo small{
 display:block;
 color:#475569;
 font-size:9px;
 text-transform:uppercase;
 letter-spacing:2px;
 margin-top:5px;
}

.nav{
 padding:20px 12px;
 flex:1;
 overflow:auto;
}

.nav-title,
.eyebrow{
 font-size:9px;
 text-transform:uppercase;
 letter-spacing:2px;
 color:#64748b;
}

.nav-title{
 padding:0 12px 10px;
}

.nav button{
 width:100%;
 padding:12px;
 border:0;
 background:transparent;
 color:#94a3b8;
 text-align:left;
 border-radius:8px;
 margin:2px 0;
}

.nav button:hover{
 background:#ffffff08;
}

.nav button.active{
 background:#5eead41a;
 color:var(--teal);
}

.count{
 float:right;
 background:#ef44441a;
 color:#fca5a5;
 border-radius:99px;
 padding:2px 6px;
 font-size:9px;
}

.score-box{
 margin:20px 0;
 padding:15px;
 border:1px solid #5eead41a;
 border-radius:12px;
 background:#5eead408;
}

.score{
 font-size:26px;
 font-weight:bold;
 margin-top:8px;
}

.bar{
 height:6px;
 background:#ffffff0b;
 border-radius:5px;
 margin-top:12px;
 overflow:hidden;
}

.bar i{
 display:block;
 height:100%;
 background:var(--teal);
}

.score-box button,
.link{
 background:none;
 border:0;
 color:var(--teal);
 font-size:11px;
 margin-top:10px;
}

.side-bottom{
 padding:15px;
 border-top:1px solid #ffffff0d;
}

.side-bottom button{
 width:100%;
 background:#ffffff08;
 color:#cbd5e1;
 border:1px solid #ffffff12;
 padding:12px;
 border-radius:8px;
}

main{
 margin-left:256px;
 min-height:100vh;
}

.topbar{
 height:80px;
 position:sticky;
 top:0;
 z-index:300;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 32px;
 background:#0b0f1aee;
 border-bottom:1px solid #ffffff0d;
 backdrop-filter:blur(15px);
}

.topbar-actions{
 display:flex;
 gap:10px;
}

.btn,
.topbar button{
 border:1px solid #ffffff14;
 background:#111827;
 color:#cbd5e1;
 padding:11px 15px;
 border-radius:8px;
 font-size:12px;
}

.btn.primary{
 background:var(--teal);
 color:#071019;
 border-color:var(--teal);
 font-weight:bold;
}

.content{
 padding:32px;
}

.grid{
 display:grid;
 gap:24px;
}

.two{
 grid-template-columns:1.35fr 1fr;
}

.half{
 grid-template-columns:1fr 1fr;
}

.kpis{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin:25px 0;
}

.kpi,
.card{
 border:1px solid #ffffff0d;
 background:var(--card);
 border-radius:12px;
 padding:20px;
}

.kpi-label{
 font-size:10px;
 text-transform:uppercase;
 letter-spacing:1px;
 color:#64748b;
}

.kpi-value{
 font-size:25px;
 font-weight:bold;
 margin-top:10px;
}

.kpi-sub{
 font-size:10px;
 color:#475569;
 margin-top:5px;
}

.hero{
 padding:28px;
 border:1px solid #ffffff0d;
 background:var(--card);
 border-radius:16px;
}

.hero h2{
 font-size:clamp(35px,4vw,54px);
 line-height:1.1;
 margin-top:18px;
 max-width:750px;
}

.hero p{
 color:#94a3b8;
 font-size:14px;
 line-height:1.8;
 margin-top:18px;
 max-width:700px;
}

.actions{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:20px;
}

.profile-card{
 padding:24px;
 border:1px solid #5eead41a;
 background:#0b151e;
 border-radius:16px;
}

.profile-score{
 font-size:32px;
 font-weight:bold;
 margin-top:12px;
}

.prefs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin-top:15px;
}

.pref{
 padding:9px;
 border:1px solid #ffffff0b;
 border-radius:8px;
 font-size:10px;
 color:#475569;
}

.pref.on{
 color:var(--teal);
 border-color:#5eead433;
 background:#5eead408;
}

.section-head{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:15px;
 margin-bottom:18px;
}

.section-head h2{
 font-size:30px;
 margin-top:8px;
}

.desc{
 color:#64748b;
 font-size:13px;
 margin-top:8px;
 line-height:1.6;
}

.map{
 height:480px;
 position:relative;
 overflow:hidden;
 border:1px solid #2dd4bf26;
 border-radius:12px;
 background:#040a12;
}

.map.compact{
 height:250px;
}

.map:before{
 content:"";
 position:absolute;
 inset:0;
 background-image:
 linear-gradient(#2dd4bf1a 1px,transparent 1px),
 linear-gradient(90deg,#2dd4bf1a 1px,transparent 1px);
 background-size:38px 38px;
}

.ring{
 position:absolute;
 border:1px solid #2dd4bf18;
 border-radius:50%;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
}

.r1{
 width:360px;
 height:360px;
}

.r2{
 width:250px;
 height:250px;
}

.map svg{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
}

.node{
 position:absolute;
 transform:translate(-50%,-50%);
 color:var(--teal);
 font:8px monospace;
}

.dot{
 width:15px;
 height:15px;
 border-radius:50%;
 background:var(--teal);
 border:2px solid #04101a;
 box-shadow:0 0 16px #2dd4bf;
}

.node label{
 position:absolute;
 left:22px;
 top:0;
 white-space:nowrap;
}

.risk{
 position:absolute;
 left:47%;
 top:64%;
 width:80px;
 height:80px;
 border:1px solid #fb923c55;
 background:#fb923c0d;
 color:#fdba74;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:8px;
 text-transform:uppercase;
}

.map-info{
 position:absolute;
 left:16px;
 top:16px;
 background:#07101aee;
 border:1px solid #2dd4bf26;
 border-radius:8px;
 padding:10px;
 font-size:8px;
}

.map-info b{
 color:var(--teal);
 display:block;
 letter-spacing:2px;
}

.map-info span{
 color:#475569;
 display:block;
 margin-top:4px;
}

.alert,
.trip,
.facility,
.route{
 width:100%;
 text-align:left;
 border:1px solid #ffffff0d;
 background:var(--card);
 color:var(--text);
 padding:17px;
 border-radius:10px;
 margin-bottom:10px;
}

.alert:hover,
.trip:hover,
.facility:hover,
.route:hover{
 border-color:#2dd4bf44;
}

.badge{
 display:inline-block;
 border:1px solid #ffffff12;
 background:#ffffff08;
 border-radius:99px;
 padding:5px 9px;
 font-size:10px;
 text-transform:uppercase;
 letter-spacing:1px;
 color:#94a3b8;
}

.badge.info{
 color:var(--teal);
 background:#2dd4bf0d;
 border-color:#2dd4bf33;
}

.badge.success{
 color:#6ee7b7;
 background:#34d39912;
}

.badge.warning{
 color:#fdba74;
 background:#fb923c12;
}

.badge.danger{
 color:#fca5a5;
 background:#ef444412;
}

.list{
 margin-top:15px;
}

.row{
 display:flex;
 justify-content:space-between;
 gap:15px;
 align-items:center;
}

.muted{
 color:#64748b;
 font-size:10px;
}

.small{
 font-size:12px;
}

.route-grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:15px;
 margin-top:18px;
}

.route-grid small,
.detail-grid small{
 display:block;
 color:#64748b;
 font-size:9px;
}

.route-grid strong{
 display:block;
 margin-top:5px;
 font-size:13px;
}

.form-card{
 width:360px;
}

.field{
 margin-bottom:17px;
}

.field label{
 display:block;
 color:#94a3b8;
 font-size:12px;
 margin-bottom:7px;
}

.field select,
.field input,
.field textarea{
 width:100%;
 background:#0b0f1a;
 color:#e8edf5;
 border:1px solid #ffffff16;
 border-radius:8px;
 padding:12px;
 outline:none;
}

.field textarea{
 resize:vertical;
}

.plan-grid{
 display:grid;
 grid-template-columns:360px 1fr;
 gap:24px;
}

.empty{
 min-height:420px;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 border:1px dashed #ffffff18;
 border-radius:12px;
 background:var(--card);
 color:#64748b;
}

.empty b{
 display:block;
 color:#e2e8f0;
 margin:10px;
}

.search{
 background:#111827;
 color:#fff;
 border:1px solid #ffffff16;
 padding:12px;
 border-radius:8px;
}

.facilities{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px;
}

.detail{
 margin-top:15px;
 border:1px solid #2dd4bf33;
 background:var(--card);
 padding:22px;
 border-radius:12px;
}

.detail-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
 margin-top:20px;
}

.help-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
}

.help{
 padding:20px;
 border-radius:12px;
 background:var(--card);
 border:1px solid #ffffff0d;
}

.help h3{
 margin-top:10px;
 font-size:14px;
}

.help p{
 font-size:11px;
 color:#64748b;
 margin-top:8px;
 line-height:1.6;
}

.checks{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:15px;
}

.check{
 padding:14px;
 background:#0d121f;
 border-radius:8px;
 font-size:12px;
}

.modal{
 position:fixed;
 inset:0;
 background:#0009;
 z-index:900;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 backdrop-filter:blur(5px);
}

.modal-box{
 max-width:650px;
 width:100%;
 max-height:90vh;
 overflow:auto;
 background:var(--card);
 border:1px solid #ffffff18;
 border-radius:16px;
 padding:25px;
}

.toggle{
 width:100%;
 text-align:left;
 padding:15px;
 background:#0d121f;
 color:#e2e8f0;
 border:1px solid #ffffff0d;
 border-radius:10px;
}

.toggle span{
 float:right;
 color:var(--teal);
}

.toggle.on{
 border-color:#2dd4bf44;
 background:#2dd4bf0d;
}

.settings-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:15px;
}

@media(max-width:1000px){

 .sidebar{
  transform:translateX(-100%);
  transition:.25s;
 }

 .sidebar.open{
  transform:translateX(0);
 }

 main{
  margin-left:0;
 }

 .mobile-header{
  display:flex;
 }

 .topbar{
  display:none;
 }

 .content{
  padding:84px 20px 25px;
 }

 .two,
 .half,
 .plan-grid{
  grid-template-columns:1fr;
 }

 .form-card{
  width:auto;
 }

 .kpis{
  grid-template-columns:1fr 1fr;
 }

 .facilities,
 .help-grid{
  grid-template-columns:1fr 1fr;
 }

 .route-grid,
 .detail-grid{
  grid-template-columns:1fr 1fr;
 }
}

@media(max-width:600px){

 .content{
  padding:80px 14px 20px;
 }

 .kpis,
 .facilities,
 .help-grid,
 .settings-grid,
 .prefs,
 .checks{
  grid-template-columns:1fr;
 }

 .hero h2{
  font-size:34px;
 }

 .section-head{
  align-items:start;
  flex-direction:column;
 }

 .search{
  width:100%;
 }

 .map{
  height:350px;
 }

 .route-grid,
 .detail-grid{
  grid-template-columns:1fr 1fr;
 }

 .row{
  align-items:flex-start;
 }

 .modal{
  padding:8px;
 }
}
</style>
</head>

<body>

<div id="app" class="app"></div>

<script>

/* =========================
   DATA
========================= */

const NAV=[
 "Overview",
 "Plan Trip",
 "Live Network",
 "My Trips",
 "Facilities",
 "Alerts",
 "Help & Safety",
 "Feedback"
];

const LOC=[
 "Guwahati",
 "Shillong",
 "Imphal",
 "Aizawl",
 "Kohima",
 "Agartala",
 "Itanagar",
 "Gangtok",
 "Silchar",
 "Dimapur"
];

const trips=[
 {
  id:"TRP-2041",
  from:"Guwahati",
  to:"Shillong",
  mode:"Road",
  status:"On time",
  eta:"Today 15:40",
  accessibility:91
 },
 {
  id:"TRP-2046",
  from:"Shillong",
  to:"Silchar",
  mode:"Road",
  status:"Delayed",
  eta:"Today 21:10",
  accessibility:74
 },
 {
  id:"TRP-2052",
  from:"Guwahati",
  to:"Imphal",
  mode:"Road",
  status:"At risk",
  eta:"Tomorrow 10:30",
  accessibility:82
 }
];

const alerts=[
 {
  id:1,
  level:"HIGH",
  title:"Heavy rainfall on hill route",
  place:"Shillong corridor",
  time:"12 min ago",
  detail:"Expect slower movement and possible temporary access restrictions."
 },
 {
  id:2,
  level:"MEDIUM",
  title:"Road accessibility reduced",
  place:"Kohima approach",
  time:"31 min ago",
  detail:"One lane is operating. Wheelchair-friendly vehicle transfer may take longer."
 },
 {
  id:3,
  level:"CRITICAL",
  title:"Route closure reported",
  place:"Imphal approach",
  time:"54 min ago",
  detail:"Use the alternate corridor and verify conditions before departure."
 },
 {
  id:4,
  level:"LOW",
  title:"Facility maintenance",
  place:"Guwahati transit hub",
  time:"1 hr ago",
  detail:"One accessibility lift is under scheduled maintenance."
 }
];

const facilities=[
 {
  name:"Guwahati Inclusive Transit Hub",
  type:"Transit",
  place:"Guwahati",
  score:94,
  open:true
 },
 {
  name:"Shillong Accessible Help Point",
  type:"Help Point",
  place:"Shillong",
  score:88,
  open:true
 },
 {
  name:"Imphal Mobility Support Center",
  type:"Support Center",
  place:"Imphal",
  score:81,
  open:true
 },
 {
  name:"Aizawl Rest & Assistance Hub",
  type:"Rest Area",
  place:"Aizawl",
  score:79,
  open:false
 },
 {
  name:"Kohima Accessible Transport Stop",
  type:"Transit",
  place:"Kohima",
  score:76,
  open:true
 },
 {
  name:"Agartala Medical & Travel Desk",
  type:"Medical",
  place:"Agartala",
  score:90,
  open:true
 }
];

/* =========================
   STATE
========================= */

let state={
 page:"Overview",
 menu:false,
 access:false,

 font:1,
 contrast:false,
 motion:false,
 captions:false,
 language:"English",

 profile:{
  wheelchair:false,
  lowVision:false,
  hearing:false,
  elderly:false,
  reducedWalking:false,
  quietRoutes:false
 },

 from:"Guwahati",
 to:"Shillong",
 mode:"Accessible Road",

 routeReady:false,

 selectedTrip:null,
 selectedAlert:null,
 selectedFacility:null,

 facilityQuery:"",
 report:"",
 toast:""
};

/* =========================
   HELPERS
========================= */

function esc(s){

 return String(s).replace(/[&<>"']/g,function(m){

  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m];

 });

}

function score(){

 return Math.min(
  98,
  76+
  (state.profile.wheelchair?8:0)+
  (state.profile.reducedWalking?5:0)+
  (state.profile.lowVision?4:0)+
  (state.profile.hearing?2:0)+
  (state.profile.elderly?3:0)
 );

}

function badge(text,tone="neutral"){

 return `<span class="badge ${tone}">
 ${esc(text)}
 </span>`;

}

function tone(v){

 if(v==="CRITICAL") return "danger";
 if(v==="HIGH") return "warning";
 if(v==="On time") return "success";
 if(v==="Delayed") return "warning";
 if(v==="At risk") return "danger";

 return "neutral";
}

function notify(message){

 state.toast=message;

 render();

 setTimeout(function(){

  state.toast="";
  render();

 },2400);

}

function go(page){

 state.page=page;
 state.menu=false;
 state.access=false;

 render();

}

function prefName(key){

 return key.replace(/([A-Z])/g," $1");

}

function detail(label,value){

 return `
 <div>
  <small>${label}</small>
  <strong style="display:block;margin-top:5px">
   ${esc(value)}
  </strong>
 </div>
 `;

}

function kpi(label,value,sub,icon){

 return `
 <div class="kpi">

  <div class="row">
   <span class="kpi-label">${label}</span>
   <span style="color:var(--teal)">${icon}</span>
  </div>

  <div class="kpi-value">${esc(value)}</div>

  <div class="kpi-sub">${sub}</div>

 </div>
 `;

}

/* =========================
   MAP
========================= */

function map(compact=false){

 const points=[
  ["GUWAHATI","25%","31%"],
  ["SHILLONG","39%","46%"],
  ["KOHIMA","63%","42%"],
  ["IMPHAL","69%","56%"],
  ["AIZAWL","53%","74%"],
  ["AGARTALA","31%","78%"],
  ["ITANAGAR","77%","25%"],
  ["GANGTOK","16%","37%"]
 ];

 return `
 <div class="map ${compact?"compact":""}">

  <div class="ring r1"></div>
  <div class="ring r2"></div>

  <svg viewBox="0 0 1000 500"
       preserveAspectRatio="none">

   <path
    d="M250 150 C360 180 430 230 540 260 C660 295 730 335 830 400"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="3"
    stroke-dasharray="8 8"
    opacity=".65"/>

   <path
    d="M250 150 C310 255 390 350 520 405"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="2"
    opacity=".3"/>

   <path
    d="M540 260 C620 190 710 140 820 110"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="2"
    opacity=".3"/>

   <path
    d="M540 260 C455 295 380 330 300 355"
    fill="none"
    stroke="#fb923c"
    stroke-width="3"
    stroke-dasharray="6 10"
    opacity=".7"/>

  </svg>

  ${points.map(function(p){

   return `
   <div class="node"
        style="left:${p[1]};top:${p[2]}">

    <div class="dot"></div>

    <label>${p[0]}</label>

   </div>
   `;

  }).join("")}

  <div style="
   position:absolute;
   left:52%;
   top:49%;
   transform:translate(-50%,-50%);
   color:#5eead4;
   font-size:18px">
   ▲
  </div>

  <div class="risk">
   Risk Zone
  </div>

  <div class="map-info">
   <b>REGIONAL NETWORK</b>
   <span>8 STATES · 42 NODES · LIVE</span>
  </div>

 </div>
 `;

}

/* =========================
   SIDEBAR
========================= */

function nav(){

 return `
 <aside class="sidebar ${state.menu?"open":""}">

  <div class="side-logo">

   <div class="logo">
    ◉ NER <b>SmartLogix</b>
   </div>

   <small>
    Accessible logistics
   </small>

  </div>

  <div class="nav">

   <div class="nav-title">
    Customer navigation
   </div>

   ${NAV.map(function(n){

    let icon=
     n==="Overview"?"⌂":
     n==="Plan Trip"?"⇄":
     n==="Live Network"?"◎":
     n==="My Trips"?"▣":
     n==="Facilities"?"◇":
     n==="Alerts"?"!":
     n==="Help & Safety"?"✚":

       Other
      </option>

     </select>

    </div>


    <button
     class="btn primary"
     style="margin-top:18px"
     onclick="
      state.report='';
      notify('Thank you. Your report has been submitted.');
     ">

     Submit report

    </button>

   </div>


   <div class="profile-card">

    <div
     class="eyebrow"
     style="color:var(--teal)">
     Why report?
    </div>

    <p class="desc">

     Ground feedback can highlight blocked ramps,
     inaccessible entrances, broken lifts,
     unsafe crossings and other issues that may
     not appear in official datasets.

    </p>

    <div
     class="check"
     style="margin-top:18px">

     Tip: include the exact place, time and
     what a traveler should know.

    </div>

   </div>

  </div>

 </section>
 `;

}

/* =========================
   ACCESSIBILITY MODAL
========================= */

function openAccess(){

 state.access=true;

 render();

}

function modal(){

 if(!state.access)
  return "";

 let keys=Object.keys(state.profile);

 return `
 <div
  class="modal"
  onclick="
   if(event.target===this){
    state.access=false;
    render();
   }
  ">

  <div class="modal-box">

   <div class="row">

    <div>

     <div
      class="eyebrow"
      style="color:var(--teal)">
      Personalization
     </div>

     <h2 style="margin-top:7px">
      Accessibility Settings
     </h2>

     <p class="desc">
      These settings guide route suggestions
      and the interface itself.
     </p>

    </div>

    <button
     class="link"
     onclick="
      state.access=false;
      render();
     ">

     Close

    </button>

   </div>


   <div class="settings-grid">

    ${keys.map(function(k){

     return `
     <button
      class="toggle ${state.profile[k]?"on":""}"
      onclick="
       state.profile['${k}']=!state.profile['${k}'];
       render();
      ">

      <b>
       ${prefName(k)}
      </b>

      <span>
       ${state.profile[k]?"✓":"○"}
      </span>

      <small
       style="
        display:block;
        color:#64748b;
        margin-top:7px">

       ${
        k==="wheelchair"
        ?
        "Prefer step-free and accessible vehicle options."

        :

        k==="lowVision"
        ?
        "Increase visual guidance and contrast cues."

        :

        k==="hearing"
        ?
        "Prefer visual alerts and captions."

        :

        k==="elderly"
        ?
        "Prioritize comfort and shorter transfer paths."

        :

        k==="reducedWalking"
        ?
        "Minimize walking distance between transfers."

        :

        "Prefer calmer routes when options are similar."
       }

      </small>

     </button>
     `;

    }).join("")}

   </div>


   <div
    style="
     margin-top:25px;
     border-top:1px solid #ffffff0d;
     padding-top:20px">

    <div class="eyebrow">
     Interface controls
    </div>


    <div class="settings-grid">

     <div class="toggle">

      <b>
       Text size
      </b>

      <span>

       <button
        class="btn"
        onclick="
         state.font=Math.max(.9,state.font-.1);
         render();
        ">
        A−
       </button>

       <button
        class="btn"
        onclick="
         state.font=Math.min(1.3,state.font+.1);
         render();
        ">
        A+
       </button>

      </span>

     </div>


     <button
      class="toggle"
      onclick="
       state.contrast=!state.contrast;
       render();
      ">

      High contrast

      <span>
       ${state.contrast?"ON":"OFF"}
      </span>

     </button>


     <button
      class="toggle"
      onclick="
       state.motion=!state.motion;
       render();
      ">

      Reduce motion

      <span>
       ${state.motion?"ON":"OFF"}
      </span>

     </button>


     <button
      class="toggle"
      onclick="
       state.captions=!state.captions;
       render();
      ">

      Visual captions

      <span>
       ${state.captions?"ON":"OFF"}
      </span>

     </button>

    </div>

   </div>


   <div
    class="toggle"
    style="margin-top:15px">

    <b>
     Language
    </b>

    <select
     class="search"
     style="margin-top:10px"
     onchange="state.language=this.value">

     <option>English</option>
     <option>Hindi</option>
     <option>Assamese</option>
     <option>Manipuri</option>
     <option>Khasi</option>

    </select>

   </div>


   <div
    class="actions"
    style="justify-content:flex-end">

    <button
     class="btn"
     onclick="
      Object.keys(state.profile)
       .forEach(function(k){
        state.profile[k]=false;
       });
      render();
     ">

     Reset preferences

    </button>


    <button
     class="btn primary"
     onclick="
      state.access=false;
      notify('Accessibility preferences saved.');
     ">

     Save preferences

    </button>

   </div>

  </div>

 </div>
 `;

}

/* =========================
   PAGE SWITCHING
========================= */

function page(){

 switch(state.page){

  case "Overview":
   return overview();

  case "Plan Trip":
   return plan();

  case "Live Network":
   return live();

  case "My Trips":
   return myTrips();

  case "Facilities":
   return facilitiesPage();

  case "Alerts":
   return alertsPage();

  case "Help & Safety":
   return help();

  case "Feedback":
   return feedback();

  default:
   return overview();

 }

}

/* =========================
   RENDER
========================= */

function render(){

 document.getElementById("app").innerHTML=

  header()+
  nav()+
  `<main>
    ${topbar()}
    ${page()}
   </main>`+

  (
   state.toast
   ?
   `
   <div class="toast">
    <span>✓</span>
    ${esc(state.toast)}
   </div>
   `
   :
   ""
  )+

  modal();


 document.getElementById("app").style.fontSize=
  state.font+"em";

 document.getElementById("app").classList.toggle(
  "high-contrast",
  state.contrast
 );

}

/* START */

render();

</script>

</body>
</html>
